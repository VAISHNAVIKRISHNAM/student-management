<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Student Management System</h1>
            <p>Manage student records easily</p>
        </div>
    </header>

    <main class="container">

        <section class="card">
            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input
                        type="text"
                        id="course"
                        placeholder="Enter course"
                        required
                    >
                </div>

                <button type="submit">
                    Add Student
                </button>

            </form>

            <p id="message"></p>
        </section>

        <section class="card">

            <div class="section-header">
                <h2>Student Records</h2>

                <span id="studentCount">
                    0 Students
                </span>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentList">
                    </tbody>

                </table>

                <div id="emptyMessage" class="empty">
                    No students found.
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Student Management System &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
